spring:
  application:
    name: lost-and-found-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lostfound}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: pre-flyway-schema
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

google:
  client-id: ${GOOGLE_CLIENT_ID}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  cleanup:
    initial-delay: ${CLEANUP_INITIAL_DELAY:5000}
    interval: ${CLEANUP_INTERVAL:3600000}

services:
  clip:
    base-url: ${CLIP_SERVICE_URL:http://localhost:8000}
    api-key: ${CLIP_API_TOKEN:your-secure-api-token-here}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    vision-model: ${OLLAMA_VISION_MODEL:qwen2.5vl}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:60}
    enabled: ${OLLAMA_ENABLED:true}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
